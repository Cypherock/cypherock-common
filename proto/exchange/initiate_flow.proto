syntax = "proto3";

package exchange;

import "error.proto";

message CoinDetails {
  uint32 applet_id = 1;
  bytes wallet_id = 2;
}

message InitiateExchangeRequest {
  CoinDetails from = 1;
  CoinDetails to = 2;
}

message InitiatePrivateSendRequest { CoinDetails from = 1; }

message InitiateExchangeResponse {}

message InitiateFlowRequest {
  oneof request {
    InitiateExchangeRequest initiate = 1;
    InitiatePrivateSendRequest initiate_private_send = 2;
  }
}

message InitiateFlowResponse {
  oneof response {
    InitiateExchangeResponse result = 1;
    error.CommonError common_error = 2;
  }
}
